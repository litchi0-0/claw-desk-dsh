<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'none'">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:#24404b;font:12px/1.5 system-ui,sans-serif;user-select:none}
.bubble{margin:2px 5px 12px;padding:10px 13px;background:rgba(246,253,255,.97);border:1px solid #9ccbd9;border-radius:15px;position:relative}
.bubble:after{content:"";position:absolute;left:calc(50% - 5px);bottom:-6px;width:10px;height:10px;background:#f6fdff;border-right:1px solid #9ccbd9;border-bottom:1px solid #9ccbd9;transform:rotate(45deg)}
#title{font-size:11px;color:#527684;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
#body{white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-weight:550;overflow-wrap:anywhere}
#picture{display:none;width:100%;height:250px;object-fit:contain;border-radius:8px}
</style></head><body><div class="bubble"><div id="title"></div><div id="body"></div><img id="picture" alt="大肥鱼表情"></div></body></html>
